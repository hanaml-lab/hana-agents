[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-gym"
version = "0.3.4"
description = "A task suite, trajectory scoring and recovery strategies for agents that use a web browser."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hanaML", email = "hello@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "agent-runtime-sdk"]

[project.scripts]
browser-gym = "browser_gym.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["browser_gym"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "browser_gym/tasks"
